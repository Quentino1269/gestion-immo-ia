services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion-immo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_immo
      POSTGRES_USER: gestion_immo
      POSTGRES_PASSWORD: gestion_immo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion_immo -d gestion_immo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
