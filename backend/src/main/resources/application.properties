spring.application.name=gestion-immo-backend

# --- Datasource (alignée sur infrastructure/docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_immo
spring.datasource.username=gestion_immo
spring.datasource.password=gestion_immo
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
# Batch les inserts multi-événements d'un même append (event_store) en un aller-retour DB.
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# --- Jackson (event store : évite la notation scientifique qui corromprait Bien.surfaceM2) ---
spring.jackson.generator.write-bigdecimal-as-plain=true

# --- Server ---
server.port=8080

# --- Actuator (expose /actuator/health avec composant db) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
